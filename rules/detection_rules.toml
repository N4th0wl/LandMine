severity = "High"
tags = ["mitre.t1053.005"]
[rules.conditions]
process_name = ["schtasks.exe"]
command_line_contains = ["/create"]
command_line_contains_any = ["/sc onlogon", "/sc onstart", "/ru system"]

[[rules]]
id = "sc_service_create"
name = "Windows Service Creation via SC.exe"
severity = "High"
tags = ["mitre.t1543.003"]
[rules.conditions]
process_name = ["sc.exe"]
command_line_contains_any = ["create", "binpath="]

[[rules]]
id = "reg_run_key_persistence"
name = "Registry Run / RunOnce Auto-start Key Modification"
severity = "High"
tags = ["mitre.t1547.001"]
[rules.conditions]
process_name = ["reg.exe"]
command_line_contains = ["add"]
command_line_contains_any = ["\\currentversion\\run", "\\currentversion\\runonce"]

[[rules]]
id = "wmiprvse_spawning_shell"
name = "WMI Provider Host Spawning Shell (WMI Persistence / Lateral Movement)"
severity = "High"
tags = ["mitre.t1047"]
[rules.conditions]
parent_name = ["wmiprvse.exe"]
process_name = ["cmd.exe", "powershell.exe", "pwsh.exe", "cscript.exe", "wscript.exe"]

